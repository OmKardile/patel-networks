# =============================================================================
# Patel Networks / MegaTechzy — Render Blueprint (Node runtime, Neon Postgres)
#
# One-click deploy: Render Dashboard → New + → Blueprint → pick
# OmKardile/patel-networks → hit Apply. EVERY env var the code reads is
# HARDCODED below (owner directive — zero creation prompts, zero sync:false,
# zero generated secrets). This is the COMPLETE .env surface: the 8 core vars
# carry real values; the optional integration vars carry sim-safe sentinels
# so behaviour is identical to them being unset (see "SENTINEL CONVENTION").
# Full runbook: deploy/RENDER-STEPS.md · env deep reference: docs/ENVIRONMENT.md
#
# Manual alternative (New + → Web Service): use exactly these commands.
#   Runtime:      Node
#   Region:       Singapore (lowest latency for India)
#   Branch:       main
#   Build:        npm install && npm run db:sync && npm run build
#   Start:        npm run start
#   Health check: /api/health
#
# ⚠️ START-COMMAND GOTCHA (verified live 2026-09): Render sets HOSTNAME to the
# service hostname, and Next standalone binds to it → 502. `npm run start` now
# pins HOSTNAME=0.0.0.0 PORT=${PORT:-3000} (Task 29). The dashboard variant
#   HOSTNAME=0.0.0.0 PORT=$PORT NODE_ENV=production bun .next/standalone/server.js
# is equivalent (bun ships in Render's Node image) — keep the two in sync.
#
# ⚠️ ENV VALUES ARE COMMITTED (owner directive): this repo is public and
# `.env*` is git-ignored, so a filled .env never ships — instead every value
# lives here as a fixed `value:`. Accepted for the staging/demo posture
# (Render = staging; production = the client's VPS with private env per
# deploy/DEPLOY-STEPS.md). Rotate JWT_SECRET if the repo's visibility or
# trust boundary ever changes.
#
# The database is EXTERNAL (Neon Postgres) — Render's ephemeral disk holds
# nothing of value, so free-plan restarts/spin-downs lose no data.
# =============================================================================

services:
  - type: web
    name: patelnetworks
    runtime: node
    region: singapore # closest to India; Neon US/EU stays fine — DB latency is dominated by Neon region
    branch: main # the sole working repo's trunk; patel-5.3 is frozen and never deployed
    plan: free # spins down after ~15min idle; first visit wakes in ~50s. Use starter for client demos.
    buildCommand: npm install && npm run db:sync && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true # every push to main deploys (~2-3 min)
    envVars:
      # ═══════════════ COMPLETE .ENV SURFACE — 26 KEYS, ZERO PROMPTS ══════════
      # Every variable read via process.env.* in src/ is listed. Optional
      # integrations hold SENTINEL values that the code detects as
      # "placeholder" and routes to its documented deterministic simulation —
      # identical behaviour to the variable being unset. Going live = paste
      # the real credential HERE (or Dashboard → Environment; dashboard wins
      # on re-apply conflict) and redeploy. Detection rules per service:
      # docs/ENVIRONMENT.md.
      #
      # ── 1 · DATABASE ─────────────────────────────────────────────────────
      # THE ONE LINE WITH A REAL SECRET. Live Neon string (owner-provided).
      # `channel_binding=require` is Neon's default; Prisma 6 tolerates it.
      # If Neon rotates the password/resets the branch, update HERE and in
      # Dashboard → Environment. Placeholder/unreachable host ⇒ build fails
      # at `db:sync` with P1001 "Can't reach database server" (greppable).
      - key: DATABASE_URL
        value: "postgresql://neondb_owner:npg_I3duwTRoOi2K@ep-wandering-recipe-b4otp3rv.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
      # ── 2 · WEB ORIGIN ───────────────────────────────────────────────────
      # Public origin, inlined into client bundles at BUILD time
      # (metadataBase, canonicals, sitemap.xml, robots.txt, OG). Matches the
      # Render-assigned URL. If the service URL ever changes, fix this value
      # and run "Manual Deploy → Clear build cache & deploy" (build-time).
      - key: NEXT_PUBLIC_APP_URL
        value: https://patelnetworks-5ne3.onrender.com
      # ── 3 · SESSIONS & OTP ───────────────────────────────────────────────
      # Signs session JWTs (pn_session / pn_admin_session) AND hashes OTP
      # codes (sha256(code:JWT_SECRET)). MUST stay stable across deploys —
      # changing it logs out every operator/customer and voids outstanding
      # OTPs. Rotate (openssl rand -hex 32) only if credentials leak.
      - key: JWT_SECRET
        value: f826881f4188b2f2a867ac7418f5f0f7533740bec54c6a19f1b61f97d45e383d
      # ── 4 · ADMIN BOOTSTRAP ──────────────────────────────────────────────
      # Disaster-recovery parity: if no user matches ADMIN_EMAIL at
      # /admin/login, a SUPER_ADMIN is bootstrapped with ADMIN_PASSWORD
      # (guard requires BOTH non-empty — src/server/services/auth.service.ts).
      # Same credentials as the seed.
      - key: ADMIN_EMAIL
        value: superadmin@patelnetworks.in
      - key: ADMIN_PASSWORD
        value: patel@admin2026
      # ── 5 · PAYMENTS — RAZORPAY ──────────────────────────────────────────
      # Sentinels ⇒ isRazorpayMockMode()=true → checkout runs the sandbox
      # /api/payments/razorpay/simulate flow (orders order_sim_*), fully
      # working end-to-end. GO LIVE: real Key Id + Key Secret from Razorpay
      # Dashboard → Settings → API Keys; put the SAME webhook secret in
      # Razorpay Dashboard → Webhooks. The three defaults below are the exact
      # strings the code falls back to when unset — swapping them for real
      # values is the only change needed.
      - key: RAZORPAY_KEY_ID
        value: rzp_test_placeholder_key_id # → rzp_live_… / rzp_test_…
      - key: RAZORPAY_KEY_SECRET
        value: placeholder_secret_key # → real key secret
      - key: RAZORPAY_WEBHOOK_SECRET
        value: placeholder_webhook_secret # → openssl rand -hex 16, mirror in Razorpay
      # ── 6 · SHIPPING — SHIPROCKET / DELHIVERY ────────────────────────────
      # Sentinels ⇒ isShiprocketMockMode()/isDelhiveryMockMode()=true →
      # deterministic AWBs (DELH<10hex>), zone-based ETAs, printable labels.
      # GO LIVE: ONE provider's real credentials is enough (Shiprocket
      # account email+password, or a Delhivery API key). Pickup postcode is
      # hardcoded to the Surat hub 395003 (STORE.originPin).
      - key: SHIPROCKET_EMAIL
        value: placeholder # → real Shiprocket login email
      - key: SHIPROCKET_PASSWORD
        value: placeholder # → real Shiprocket password
      - key: SHIPROCKET_API_URL
        value: https://apiv2.shiprocket.in/v1/external # documented default; override only per Shiprocket notice
      - key: DELHIVERY_API_KEY
        value: placeholder # → real Delhivery key (direct integration still routes via simulator until keyed; scans sync the FSM)
      # Carrier tracking webhook shared secret (POST /api/webhooks/shipping,
      # header x-webhook-token or ?token=). EMPTY = sandbox posture: events
      # accepted with a per-request "set before go-live" server warning.
      # Setting ANY non-empty value flips the route to strict 401-reject
      # mode — only fill it together with the carrier's webhook config.
      - key: SHIPPING_WEBHOOK_TOKEN
        value: ""
      # ── 7 · SMS — FAST2SMS (DLT) ─────────────────────────────────────────
      # Sentinel ⇒ OTPs print as `[SIMULATED SMS] … OTP: <code>` in server
      # logs; API responses carry simulated:true. GO LIVE (required before
      # real customer OTP logins): Fast2SMS API key + DLT sender + approved
      # OTP template id.
      - key: SMS_GATEWAY_API_KEY
        value: placeholder # → real Fast2SMS key
      - key: SMS_SENDER_ID
        value: PTLNET # 6-char DLT sender (code default); change to the client's registered sender
      - key: SMS_TEMPLATE_ID
        value: "" # DLT OTP template id — only meaningful with a real key
      # ── 8 · WHATSAPP — META CLOUD API (Graph v20) ────────────────────────
      # Sentinels ⇒ `[SIMULATED WHATSAPP]` log box + WHATSAPP_DISPATCH_SIMULATED
      # audit rows (order_confirmation / dispatched / out_for_delivery /
      # delivered / cod_verification / b2b_quote_inquiry / platform_enquiry).
      # GO LIVE: Meta WhatsApp Cloud token + phone-number id from the Meta
      # App Dashboard; VERIFY_TOKEN is for the GET webhook subscription
      # challenge (set the same value in Meta → Webhooks).
      - key: WHATSAPP_ACCESS_TOKEN
        value: placeholder # → permanent Meta system-user token
      - key: WHATSAPP_PHONE_NUMBER_ID
        value: placeholder # → Meta phone number id
      - key: WHATSAPP_VERIFY_TOKEN
        value: placeholder_verify_token # exact string the code accepts when unset; replace before subscribing the webhook
      # ── 9 · STORE OVERRIDES ──────────────────────────────────────────────
      # Exact code defaults (ADR-014 / src/lib/constants.ts) pinned for
      # dashboard visibility. GSTIN renders on GST invoices + footer —
      # replace with the client's real GSTIN in production. WhatsApp value
      # is BUILD-TIME inlined (wa.me deep links on contact page + floating
      # widget): after changing it, run "Clear build cache & deploy".
      - key: STORE_GSTIN
        value: 24AAACP1234F1Z8 # → client's real GSTIN
      - key: NEXT_PUBLIC_SUPPORT_WHATSAPP
        value: "919876543210" # digits only, 91 prefix, no + (code default)
      # ── 10 · DEVELOPER / SHOWCASE PITCH ──────────────────────────────────
      # Platform (/showcase) enquiries land on the DEVELOPER's desk —
      # deliberately separate from the store trade desk (/contact).
      # DEVELOPER_WHATSAPP empty = no WhatsApp ping on new enquiries
      # (enquiries still persist in platform_inquiries; success card offers
      # a prefilled mailto). A ping fires only when this is set AND the
      # WhatsApp Cloud credentials above are real.
      - key: DEVELOPER_EMAIL
        value: omkardile84@gmail.com # code default; recipient on the showcase success-card mailto
      - key: DEVELOPER_WHATSAPP
        value: "" # digits only, 91 prefix, no + — set to enable the developer ping
      # ── 11 · FIXED BUILD/RUNTIME PINS ────────────────────────────────────
      - key: NODE_VERSION
        value: "22"
      # Belt-and-braces: guarantees devDependencies (tailwindcss,
      # @tailwindcss/postcss, typescript — all required by `next build`)
      # install even if the build environment carries NODE_ENV=production,
      # where npm otherwise skips devDeps. Zero downside on this stack.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      # Render's Node runtime sets production at runtime; pinned here so the
      # posture is explicit in the dashboard. NEVER a non-standard value
      # (staging/development derails Next prerendering → useContext crash).
      - key: NODE_ENV
        value: production
# =============================================================================
# SENTINEL CONVENTION (why the placeholder values are safe to commit):
#   - Razorpay: isRazorpayMockMode() → key missing / contains 'placeholder' /
#     startsWith 'rzp_test_placeholder' ⇒ sandbox simulation. The three
#     sentinel strings are byte-identical to the code's own ?? fallbacks, so
#     publicKeyId() and every HMAC verify behave exactly as with unset vars.
#   - Shiprocket/Delhivery: creds missing OR containing 'placeholder' ⇒
#     deterministic simulated AWBs/ETAs.
#   - SMS/WhatsApp: isPlaceholder() → missing / contains 'placeholder' /
#     startsWith 'YOUR_' ⇒ simulated dispatch with audit trail.
#   - SHIPPING_WEBHOOK_TOKEN / SMS_TEMPLATE_ID / DEVELOPER_WHATSAPP are ""
#     because ANY non-empty value would activate strict real behaviour
#     (webhook token enforcement, DLT template, developer ping) — they stay
#     empty until the real credential exists.
# Variable-by-variable runbook: deploy/ENV-SETUP.md · reference:
# docs/ENVIRONMENT.md · per-var deep dive: docs/ENVIRONMENT-VARIABLES-GUIDE.md
# =============================================================================
