# =============================================================================
# Patel Networks / MegaTechzy — Render Blueprint (Node runtime, Neon Postgres)
#
# One-click deploy: Render Dashboard → New + → Blueprint → pick
# OmKardile/patel-networks → hit Apply. EVERY env value is HARDCODED below
# (owner directive — zero creation prompts, zero generated secrets).
# The ONLY line to edit before/after the first deploy is DATABASE_URL (see
# the "THE ONE LINE TO EDIT" marker in envVars). Full runbook:
# deploy/RENDER-STEPS.md.
#
# Manual alternative (New + → Web Service): use exactly these commands.
#   Runtime:      Node
#   Region:       Singapore (lowest latency for India)
#   Branch:       main
#   Build:        npm install && npm run db:sync && npm run build
#   Start:        npm run start
#   Health check: /api/health
#
# ⚠️ START-COMMAND GOTCHA (verified live 2026-09): Render sets HOSTNAME to the
# service hostname, and Next standalone binds to it → 502. `npm run start` now
# pins HOSTNAME=0.0.0.0 PORT=${PORT:-3000} (Task 29). The dashboard variant
#   HOSTNAME=0.0.0.0 PORT=$PORT NODE_ENV=production bun .next/standalone/server.js
# is equivalent (bun ships in Render's Node image) — keep the two in sync.
#
# ⚠️ ENV VALUES ARE COMMITTED (owner directive): this repo is public and
# `.env*` is git-ignored, so a filled .env never ships — instead every value
# lives here as a fixed `value:`. Accepted for the staging/demo posture
# (Render = staging; production = the client's VPS with private env per
# deploy/DEPLOY-STEPS.md). Rotate JWT_SECRET if the repo's visibility or
# trust boundary ever changes. OPTIONAL integration keys stay in the
# commented block at the bottom — uncomment ONLY with real credentials.
#
# The database is EXTERNAL (Neon Postgres) — Render's ephemeral disk holds
# nothing of value, so free-plan restarts/spin-downs lose no data.
# =============================================================================

services:
  - type: web
    name: patelnetworks
    runtime: node
    region: singapore # closest to India; Neon US/EU stays fine — DB latency is dominated by Neon region
    branch: main # the sole working repo's trunk; patel-5.3 is frozen and never deployed
    plan: free # spins down after ~15min idle; first visit wakes in ~50s. Use starter for client demos.
    buildCommand: npm install && npm run db:sync && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true # every push to main deploys (~2-3 min)
    envVars:
      # ═══════════════════════ ALL VALUES HARDCODED — ZERO PROMPTS ═══════════
      # Owner directive: no sync:false prompts, no generateValue — create the
      # Blueprint and hit Apply. Exactly ONE line needs a real value before
      # the first deploy: DATABASE_URL (only the Neon console knows it).
      #
      # ⚠️ PUBLIC-REPO POSTURE: these values are committed. That is accepted
      # for the staging/demo posture (Render = staging; production = the
      # client's VPS with private env per deploy/DEPLOY-STEPS.md). If this
      # repo is ever made private↔public or credentials leak, rotate
      # JWT_SECRET (openssl rand -hex 32) — rotating logs out every session
      # and voids outstanding OTPs.
      #
      # ── THE ONE LINE TO EDIT ──────────────────────────────────────────────
      # Neon Postgres connection string. Neon Dashboard → your project →
      # Connection Details → copy the whole string OVER the value below.
      # Keep `?sslmode=require`; Prisma tolerates Neon's `channel_binding`
      # param if present. Wrong/placeholder value ⇒ build fails at `db:sync`
      # with P1012 "Environment variable not found" / auth errors (greppable).
      - key: DATABASE_URL
        value: "postgresql://USER:PASSWORD@ep-XXXXX-XXXXX.REGION.aws.neon.tech/neondb?sslmode=require" # ← PASTE YOUR NEON STRING HERE
      # Public origin, inlined into client bundles at BUILD time
      # (metadataBase, canonicals, sitemap.xml, robots.txt, OG). The service
      # name below is `patelnetworks`, so this URL matches Render's default
      # assignment. If Render appends a suffix (name taken), fix this value
      # to the real URL after the first deploy and run
      # "Manual Deploy → Clear build cache & deploy" (build-time inlining).
      - key: NEXT_PUBLIC_APP_URL
        value: https://patelnetworks-5ne3.onrender.com
      # Signs session JWTs (pn_session / pn_admin_session) AND hashes OTP
      # codes (sha256(code:JWT_SECRET)). Generated for this deploy
      # (openssl rand -hex 32); MUST stay stable across deploys — changing it
      # logs out every operator/customer and voids outstanding OTPs.
      - key: JWT_SECRET
        value: f826881f4188b2f2a867ac7418f5f0f7533740bec54c6a19f1b61f97d45e383d
      # Operator bootstrap (disaster-recovery parity; the DB ships pre-seeded
      # with the same owner account, so these only fire if that user ever
      # disappears). Guard requires BOTH values non-empty
      # (src/server/services/auth.service.ts). Same credentials as the seed.
      - key: ADMIN_EMAIL
        value: superadmin@patelnetworks.in
      - key: ADMIN_PASSWORD
        value: patel@admin2026
      # ── fixed build/runtime pins ──
      - key: NODE_VERSION
        value: "22"
      # Belt-and-braces: guarantees devDependencies (tailwindcss,
      # @tailwindcss/postcss, typescript — all required by `next build`)
      # install even if the build environment carries NODE_ENV=production,
      # where npm otherwise skips devDeps. Zero downside on this stack.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      # Render's Node runtime sets production at runtime; pinned here so the
      # posture is explicit in the dashboard. NEVER a non-standard value
      # (staging/development derails Next prerendering → useContext crash).
      - key: NODE_ENV
        value: production

# =============================================================================
# OPTIONAL INTEGRATIONS — the rest of the .env surface, intentionally left
# commented (no real credentials exist yet). Uncomment individually with real
# values, or add them in Dashboard → Environment later; blank/placeholder/
# unset keys activate the documented deterministic simulation, so there is no
# rush. Fill-in order and posture per key: deploy/ENV-SETUP.md ·
# reference table: docs/ENVIRONMENT.md
#
# Payments — Razorpay (unset ⇒ simulated orders order_sim_* via the sandbox
#            /api/payments/razorpay/simulate endpoint; checkout fully works)
# - key: RAZORPAY_KEY_ID            # rzp_live_xxxxxxxx (or rzp_test_…)
#   sync: false
# - key: RAZORPAY_KEY_SECRET
#   sync: false
# - key: RAZORPAY_WEBHOOK_SECRET    # SAME value in Razorpay Dashboard → Webhooks
#   sync: false
#
# Shipping — Shiprocket (unset ⇒ deterministic AWBs DELH<10hex>, zone ETAs)
# - key: SHIPROCKET_EMAIL
#   sync: false
# - key: SHIPROCKET_PASSWORD
#   sync: false
# - key: SHIPPING_WEBHOOK_TOKEN     # carrier webhook shared secret (x-webhook-token)
#   sync: false
#
# SMS — Fast2SMS-compatible, DLT (unset ⇒ `[SIMULATED SMS] OTP: <code>` in logs)
# - key: SMS_GATEWAY_API_KEY
#   sync: false
# - key: SMS_SENDER_ID              # 6-char DLT sender, e.g. PTLNET
# - key: SMS_TEMPLATE_ID            # DLT template id for the OTP message
#
# WhatsApp Cloud API — Meta Graph v20 (unset ⇒ [SIMULATED WHATSAPP] + audit row)
# - key: WHATSAPP_ACCESS_TOKEN
#   sync: false
# - key: WHATSAPP_PHONE_NUMBER_ID
#   sync: false
# - key: WHATSAPP_VERIFY_TOKEN      # Meta webhook GET challenge verify token
#   sync: false
#
# Store overrides (safe defaults live in src/lib/constants.ts / ADR-014)
# - key: STORE_GSTIN                # client's real GSTIN for GST invoices — replace 24AAACP1234F1Z8
# - key: NEXT_PUBLIC_SUPPORT_WHATSAPP  # wa.me deep links, digits only, 91 prefix, no +
#
# Developer/showcase pitch (platform enquiries — not store trade)
# - key: DEVELOPER_EMAIL            # default omkardile84@gmail.com
# - key: DEVELOPER_WHATSAPP         # optional ping on new platform enquiries
# =============================================================================
